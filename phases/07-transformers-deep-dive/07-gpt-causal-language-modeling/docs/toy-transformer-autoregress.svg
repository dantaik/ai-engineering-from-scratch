<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 820" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#5F6368"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#EA4335"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="820" fill="#FFFFFF"/>

  <text x="440" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#202124">自回归生成：把自己的输出粘回输入末尾</text>
  <text x="440" y="62" text-anchor="middle" font-size="13" fill="#5F6368">模型无状态 —— 每一步都是同一个函数 f(全部前文) → 下一个 token；缓存的只是中间结果</text>

  <!-- step 1 -->
  <text x="60" y="106" font-size="14" font-weight="bold" fill="#1A73E8">第 1 步 · prefill：整个 prompt 一次算完</text>
  <g stroke="#1A73E8" fill="#BBDEFB">
    <rect x="60" y="118" width="42" height="38" rx="6"/><rect x="108" y="118" width="42" height="38" rx="6"/><rect x="156" y="118" width="42" height="38" rx="6"/>
  </g>
  <g font-size="14" fill="#0D47A1" text-anchor="middle">
    <text x="81" y="142">我</text><text x="129" y="142">爱</text><text x="177" y="142">吃</text>
  </g>
  <line x1="204" y1="137" x2="300" y2="137" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="305" y="112" width="170" height="50" rx="10" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="390" y="142" text-anchor="middle" font-size="14" fill="#1A73E8">f：3 层玩具模型</text>
  <line x1="475" y1="137" x2="540" y2="137" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="545" y="114" width="80" height="46" rx="10" fill="#1E8E3E"/>
  <text x="585" y="142" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">苹果</text>
  <text x="60" y="184" font-size="12" fill="#5F6368">注意力：3×3 全表（O(n²) 付一次）　　取第 3 位的输出去预测</text>
  <!-- cache 1 -->
  <rect x="680" y="100" width="150" height="86" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="755" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">KV 缓存（每层一份）</text>
  <g font-size="11" fill="#5F6368" text-anchor="middle">
    <text x="755" y="140">我 的 K,V</text><text x="755" y="157">爱 的 K,V</text><text x="755" y="174">吃 的 K,V</text>
  </g>
  <line x1="390" y1="162" x2="390" y2="200" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="390" y1="200" x2="676" y2="200" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="676" y1="200" x2="676" y2="150" stroke="#F9A825" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#ar2)"/>
  <text x="500" y="215" font-size="10" fill="#B8860B">3 份 K/V 存入缓存</text>

  <!-- paste-back arrow 1 -->
  <path d="M 585 162 C 585 240, 260 230, 253 278" fill="none" stroke="#EA4335" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arRed)"/>
  <text x="430" y="252" font-size="12" fill="#EA4335">输出粘回队尾</text>

  <!-- step 2 -->
  <text x="60" y="310" font-size="14" font-weight="bold" fill="#1A73E8">第 2 步 · decode：只算新来的一个</text>
  <g stroke="#B0BEC5" fill="#ECEFF1">
    <rect x="60" y="322" width="42" height="38" rx="6"/><rect x="108" y="322" width="42" height="38" rx="6"/><rect x="156" y="322" width="42" height="38" rx="6"/>
  </g>
  <g font-size="14" fill="#9E9E9E" text-anchor="middle">
    <text x="81" y="346">我</text><text x="129" y="346">爱</text><text x="177" y="346">吃</text>
  </g>
  <rect x="232" y="322" width="56" height="38" rx="6" fill="#FFE082" stroke="#F9A825"/>
  <text x="260" y="346" text-anchor="middle" font-size="14" fill="#7B5800">苹果</text>
  <line x1="294" y1="341" x2="300" y2="341" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="305" y="316" width="170" height="50" rx="10" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="390" y="346" text-anchor="middle" font-size="14" fill="#1A73E8">同一个 f</text>
  <line x1="475" y1="341" x2="540" y2="341" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="545" y="318" width="80" height="46" rx="10" fill="#1E8E3E"/>
  <text x="585" y="346" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">很</text>
  <text x="60" y="388" font-size="12" fill="#5F6368">灰色 = 不重算：它们的 K/V 从缓存读　　新 Q 对 4 份 K 打一行分（1×4，O(n)）</text>
  <!-- cache 2 -->
  <rect x="680" y="298" width="150" height="104" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="755" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">KV 缓存</text>
  <g font-size="11" fill="#5F6368" text-anchor="middle">
    <text x="755" y="338">我 的 K,V</text><text x="755" y="355">爱 的 K,V</text><text x="755" y="372">吃 的 K,V</text>
  </g>
  <text x="755" y="391" text-anchor="middle" font-size="11" font-weight="bold" fill="#B8860B">＋ 苹果 的 K,V</text>

  <!-- paste-back arrow 2 -->
  <path d="M 585 366 C 585 445, 315 435, 308 482" fill="none" stroke="#EA4335" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arRed)"/>
  <text x="440" y="456" font-size="12" fill="#EA4335">再粘回队尾</text>

  <!-- step 3 -->
  <text x="60" y="514" font-size="14" font-weight="bold" fill="#1A73E8">第 3 步 · decode：同样只算一个</text>
  <g stroke="#B0BEC5" fill="#ECEFF1">
    <rect x="60" y="526" width="42" height="38" rx="6"/><rect x="108" y="526" width="42" height="38" rx="6"/><rect x="156" y="526" width="42" height="38" rx="6"/><rect x="204" y="526" width="56" height="38" rx="6"/>
  </g>
  <g font-size="14" fill="#9E9E9E" text-anchor="middle">
    <text x="81" y="550">我</text><text x="129" y="550">爱</text><text x="177" y="550">吃</text><text x="232" y="550">苹果</text>
  </g>
  <rect x="266" y="526" width="42" height="38" rx="6" fill="#FFE082" stroke="#F9A825"/>
  <text x="287" y="550" text-anchor="middle" font-size="14" fill="#7B5800">很</text>
  <line x1="312" y1="545" x2="318" y2="545" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="323" y="520" width="152" height="50" rx="10" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="399" y="550" text-anchor="middle" font-size="14" fill="#1A73E8">还是同一个 f</text>
  <line x1="475" y1="545" x2="540" y2="545" stroke="#5F6368" stroke-width="1.5" marker-end="url(#ar2)"/>
  <rect x="545" y="522" width="80" height="46" rx="10" fill="#1E8E3E"/>
  <text x="585" y="550" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">甜</text>
  <text x="60" y="592" font-size="12" fill="#5F6368">新 Q 对 5 份 K 打分（1×5）　　n 每步 +1，KV 缓存线性长大</text>
  <!-- cache 3 -->
  <rect x="680" y="500" width="150" height="122" rx="8" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="755" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#202124">KV 缓存</text>
  <g font-size="11" fill="#5F6368" text-anchor="middle">
    <text x="755" y="540">我 的 K,V</text><text x="755" y="557">爱 的 K,V</text><text x="755" y="574">吃 的 K,V</text><text x="755" y="591">苹果 的 K,V</text>
  </g>
  <text x="755" y="610" text-anchor="middle" font-size="11" font-weight="bold" fill="#B8860B">＋ 很 的 K,V</text>

  <!-- key box -->
  <rect x="60" y="660" width="760" height="126" rx="10" fill="#E8F0FE" stroke="#1A73E8"/>
  <text x="80" y="688" font-size="13" font-weight="bold" fill="#1A73E8">为什么缓存是合法的？—— 因果掩码的深远后果</text>
  <text x="80" y="712" font-size="12" fill="#202124">前文 token 永远看不到新 token　⇒　“我 / 爱 / 吃”的表示在每一步都一模一样　⇒　算一次，存起来，永远复用。</text>
  <text x="80" y="736" font-size="12" fill="#202124">预测第 1 个和第 2 个 token 没有本质区别：都是 f(全部前文)，只是 n 长了一格、取的是新的最后一位。</text>
  <text x="80" y="760" font-size="12" fill="#5F6368">账单形态：prefill 一次付 O(n²)（整表），decode 每步付 O(n)（一行）—— 这就是"首 token 慢、后续 token 快"的原因。</text>
</svg>
